spack:
  repos:
    server: spack_repo/server
  specs:
  - bubblewrap
  - colordiff
  - ffmpeg
  - fzf
  - hyperfine
  - jq
  - 'nano@9:'
  - quota
  - ruby
  - 'screen@5:'
  - shellcheck
  # The shared configuration uses get-clipboard, introduced in tmux 3.7.
  - 'tmux@3.7:'
  - tree
  view:
    default:
      root: .spack-env/view
      link: roots
