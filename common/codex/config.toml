#:schema https://developers.openai.com/codex/config-schema.json

# ref: https://github.com/openai/codex/blob/main/docs/config.md#model_providers

model = "gpt-6-astra"
model_reasoning_effort = "xhigh"

approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = "vm_automation"
service_tier = "priority"

# Tart needs unsandboxed virtualization, but deny-read rules prevent approved escalation.
# ref: https://github.com/openai/codex/blob/rust-v0.144.4/codex-rs/core/src/tools/sandboxing.rs#L281-L303
[permissions.vm_automation]
description = "Operate MacOS VM without granting routine commands broad host access."
extends = ":workspace"

[permissions.vm_automation.workspace_roots]
# Codex always struggles with cache.
"~/.cache/uv" = true
"~/.cargo" = true
"~/.cache/huggingface" = true
"~/.tart/vms/" = true

[permissions.vm_automation.network]
enabled = true
allow_local_binding = true

[shell_environment_policy]
inherit = "all"
ignore_default_excludes = false

[shell_environment_policy.filters]
"AWS_*" = "exclude"
"AZURE_*" = "exclude"
"GCP_*" = "exclude"
"GOOGLE_*" = "exclude"
"GH_TOKEN" = "exclude"
"GITHUB_TOKEN" = "exclude"
"ANTHROPIC_API_KEY" = "exclude"
"OPENAI_API_KEY" = "exclude"
"HUGGINGFACE_*" = "exclude"
"HF_*" = "exclude"
"KAGGLE_*" = "exclude"

[notice]
hide_rate_limit_model_nudge = true

[tui]
effects.starfield = false
screen_reader_detection_done = true

[desktop]
appearanceTheme = "dark"
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = true
followUpQueueMode = "queue"
dock-icon-preference = "codex-system"
conversationDetailMode = "STEPS_PROSE"

[plugins."browser@openai-bundled"]
enabled = false

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = false

[plugins."unified-computer-use@openai-bundled"]
enabled = false

# codex mcp add kaggle --url https://www.kaggle.com/mcp --bearer-token-env-var KAGGLE_API_TOKEN
[mcp_servers.kaggle]
url = "https://www.kaggle.com/mcp"
bearer_token_env_var = "KAGGLE_API_TOKEN"
# Trust Kaggle MCP tools to avoid spending tokens on routine auto-review assessments.
default_tools_approval_mode = "approve"
