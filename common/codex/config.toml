#:schema https://developers.openai.com/codex/config-schema.json

# ref: https://github.com/openai/codex/blob/main/docs/config.md#model_providers

model = "gpt-6-astra"
model_reasoning_effort = "xhigh"

approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = "vm_automation"
personality = "pragmatic"
service_tier = "priority"

[permissions.workspace_with_secret_denies]
# ref: https://developers.openai.com/codex/permissions#extend-a-profile
extends = ":workspace"

[permissions.workspace_with_secret_denies.workspace_roots]
# Codex always struggles with uv cache.
"~/.cache/uv" = true
"~/.cargo" = true
"~/.cache/huggingface" = true

[permissions.workspace_with_secret_denies.filesystem]
glob_scan_max_depth = 4
"~/.netrc" = "deny"
"~/.aws/credentials" = "deny"
"~/**/huggingface/token" = "deny"

[permissions.workspace_with_secret_denies.filesystem.":workspace_roots"]
"." = "write"
".env" = "deny"
".env*" = "deny"
"**/.env" = "deny"
"**/.env*" = "deny"
".direnv" = "deny"
".direnv/**" = "deny"
"**/.direnv/**" = "deny"
"secrets" = "deny"
"secrets/**" = "deny"
"**/secrets/**" = "deny"

[permissions.workspace_with_secret_denies.network]
enabled = true

# Tart needs unsandboxed virtualization, but deny-read rules prevent approved escalation.
# ref: https://github.com/openai/codex/blob/rust-v0.144.4/codex-rs/core/src/tools/sandboxing.rs#L281-L303
[permissions.vm_automation]
description = "Operate MacOS VM without granting routine commands broad host access."
extends = ":workspace"

[permissions.vm_automation.workspace_roots]
# Codex always struggles with cache.
"~/.cache/uv" = true
"~/.cargo" = true
"~/.cache/huggingface" = true
"~/.tart/vms/" = true

[permissions.vm_automation.network]
enabled = true
allow_local_binding = true

[shell_environment_policy]
inherit = "all"
ignore_default_excludes = false
exclude = [
    "AWS_*",
    "AZURE_*",
    "GCP_*",
    "GOOGLE_*",
    "GH_TOKEN",
    "GITHUB_TOKEN",
    "ANTHROPIC_API_KEY",
    "OPENAI_API_KEY",
    "HUGGINGFACE_*",
    "HF_*",
    "KAGGLE_*",
]

[notice]
hide_rate_limit_model_nudge = true

[tui]
# ref: https://learn.chatgpt.com/docs/config-schema.json#/definitions/Tui/properties/whimsy
whimsy = false

[desktop]
appearanceTheme = "dark"
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = true
followUpQueueMode = "queue"
dock-icon-preference = "codex-system"
conversationDetailMode = "STEPS_PROSE"

[desktop.appearanceDarkChromeTheme]
# Use VS Code Dark Modern's blue accent instead of inheriting the account accent for text selections.
accent = "#0078d4"
accentSource = "custom"
# Keep these defaults: ChatGPT rejects themes missing required fields.
# ref: /Applications/ChatGPT.app/Contents/Resources/app.asar/.vite/build/src-J2PvP4xj.js:119 ($S: required fields; inside ASAR archive).
# ref: /Applications/ChatGPT.app/Contents/Resources/app.asar/.vite/build/window-all-closed-BKkx4ypf.js:7 (nE: invalid-setting rejection; inside ASAR archive).
contrast = 60
ink = "#ffffff"
opaqueWindows = false
surface = "#181818"
fonts = {}
semanticColors = { diffAdded = "#40c977", diffRemoved = "#fa423e", skill = "#ad7bf9" }
# codex mcp add kaggle --url https://www.kaggle.com/mcp --bearer-token-env-var KAGGLE_API_TOKEN
[mcp_servers.kaggle]
url = "https://www.kaggle.com/mcp"
bearer_token_env_var = "KAGGLE_API_TOKEN"
# Trust Kaggle MCP tools to avoid spending tokens on routine auto-review assessments.
default_tools_approval_mode = "approve"
