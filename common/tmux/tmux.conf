# Preserve application backgrounds, Powerlevel10k's palette, and multibyte text.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"

# Restore the shell display after full-screen programs such as editors exit.
set -g alternate-screen on

# Keep the outer terminal's scrollback available for ordinary mouse-wheel scrolling.
set -as terminal-overrides ",xterm*:smcup@:rmcup@"

# Keep sessions available across terminal disconnects.
set -g destroy-unattached off

# Retain 10,000 lines of command output.
set -g history-limit 10000

# Allow pane selection, resizing, and scrolling directly with the mouse.
set -g mouse on

# Match Screen's command prefix and allow Ctrl+A Ctrl+A to reach applications.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Remove defaults that conflict with the compact shortcut set below.
unbind %
unbind '"'
unbind ?
unbind Space

# Make the split direction visually apparent from its shortcut.
bind / split-window -h
bind _ split-window -v

# Reclaim the bottom two lines when the shortcut reference is unnecessary.
bind h if-shell -F '#{==:#{status},3}' 'set -g status on' 'set -g status 3'

# Match familiar window and session navigation shortcuts.
bind n next-window
bind p previous-window
bind w choose-tree -Zw
bind d detach-client

# Use arrow keys consistently for spatial pane navigation.
bind Left select-pane -L
bind Right select-pane -R
bind Up select-pane -U
bind Down select-pane -D

# Reserve two optional lines below the persistent session and window line.
set -g status 3
set -g status-position bottom

# Keep the status area legible against terminal application backgrounds.
set -g status-style 'bg=#181818,fg=white'

# Keep session, window, and active pane context visible even when help is hidden.
set -g status-format[0] '#[align=left]#S | #{W:#[fg=white#,nobold]#I:#W ,#[fg=#3b9eff#,bold]#I:#W }#[fg=white,nobold]| #P'

# Put the less frequently needed shortcut reference on toggleable lines.
set -g status-format[1] '#[align=centre,fg=#3b9eff,bold]^A /#[fg=white,nobold] Split L/R  #[fg=#3b9eff,bold]^A _#[fg=white,nobold] Split T/B  #[fg=#3b9eff,bold]^A s#[fg=white,nobold] Sessions  #[fg=#3b9eff,bold]^A h#[fg=white,nobold] Help'
set -g status-format[2] '#[align=centre,fg=#3b9eff,bold]^A ←↑↓→#[fg=white,nobold] Switch Pane  #[fg=#3b9eff,bold]^A n#[fg=white,nobold] Next Win  #[fg=#3b9eff,bold]^A p#[fg=white,nobold] Prev Win  #[fg=#3b9eff,bold]^A w#[fg=white,nobold] Windows  #[fg=#3b9eff,bold]^A d#[fg=white,nobold] Detach'
